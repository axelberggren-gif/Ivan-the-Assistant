name: deploy-pages

# Publishes the SPA to GitHub Pages on every push to main (PLAN.md
# Milestone 4: deploy as a static site). Build-only + publish: no repo
# writes, no secrets — the app stays a browser-only static site.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; a newer push supersedes an in-flight deploy.
concurrency:
  group: deploy-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Project sites are served from /<repo>/ — build with that base so
      # bundled assets, the engine worker, and problem JSON all resolve.
      - name: Build with the Pages base path
        run: npm run build -- --base=/${{ github.event.repository.name }}/

      - uses: actions/configure-pages@v5
        with:
          # Creates the Pages site on first run so no manual setup is needed.
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - id: deployment
        uses: actions/deploy-pages@v4
